name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Structural audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Links, landmarks, alt text, lang, third parties, honest claims
        run: python3 tools/check.py
      - name: Stage the publishable site
        run: tools/stage.sh

      - name: Page weight
        # Two budgets, because there are two different costs and the old single
        # total conflated them. What a visitor is *made* to download to read a
        # page stays on the hard 4 MB budget. A PDF costs a visitor nothing
        # until they choose to click one, so downloads are bounded separately
        # and much more loosely — but they are still bounded, because "it is
        # only a download" is how a site quietly grows a 200 MB video.
        run: |
          echo "Largest files:"
          find _site -type f -print | xargs du -k 2>/dev/null | sort -rn | head -12
          # -exec + rather than xargs: with no matches xargs would run `du` bare,
          # which measures the working directory and reports a passing number for
          # the wrong thing. awk gives 0 on empty input, which is the truth.
          served=$(find _site -type f ! -name '*.pdf' -exec du -k {} + | awk '{s+=$1} END{print s+0}')
          dl=$(find _site -type f -name '*.pdf' -exec du -k {} + | awk '{s+=$1} END{print s+0}')
          echo "Served with the pages: ${served} KB   ·   Opt-in downloads: ${dl} KB"
          if [ "$served" -gt 4096 ]; then
            echo "::error::Pages exceed 4 MB — page weight is a design constraint here."
            exit 1
          fi
          if [ "$dl" -gt 12288 ]; then
            echo "::error::Downloadable files exceed 12 MB. Bounded on purpose."
            exit 1
          fi

      - name: Nothing internal is publishable
        run: |
          for leaked in DEPLOY.md README.md docs tools .github; do
            if [ -e "_site/$leaked" ]; then
              echo "::error::$leaked would be served on the production domain."
              exit 1
            fi
          done
          echo "Staged site carries no build notes, tooling, or sales collateral."

  deploy:
    name: Deploy to Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the publishable site
        run: tools/stage.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
